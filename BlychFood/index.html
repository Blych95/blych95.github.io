<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BlychFood</title>
<meta name="description" content="Control de gastos de mercado, despensa y alimentación.">
<meta name="theme-color" content="#05090E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BlychFood">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05090E; --bg-2:#0A1119; --surf:#0C141C; --surf-2:#111B25; --line:#17242F; --line-2:#22323F;
  --txt:#E6F0F7; --dim:#8098AC; --dim-2:#5C7288;
  --blue:#2E7DF6; --blue-l:#6FB2FF; --blue-d:#123763;
  --green:#16C784; --green-l:#4FEEB0; --green-d:#0B4433;
  --red:#FF4757; --orange:#FFA132; --purple:#A97BFF;
  --r:14px; --mono:"JetBrains Mono",ui-monospace,monospace;
  --nav:calc(60px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Inter",system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 88% -8%, rgba(46,125,246,.13), transparent 65%),
                   radial-gradient(700px 380px at 5% 0%, rgba(22,199,132,.09), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Inter",sans-serif;font-weight:800;letter-spacing:-.025em;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
a{color:var(--blue-l)}
::-webkit-scrollbar{height:5px;width:6px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}

/* ── Cabecera ── */
header{position:sticky;top:0;z-index:30;background:rgba(5,9,14,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:900px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,var(--green),var(--blue));display:grid;place-items:center;font:800 15px "Bricolage Grotesque",sans-serif;color:#04231A;flex-shrink:0}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17.5px;letter-spacing:-.035em;white-space:nowrap}
.rates{display:flex;gap:6px}
.rate{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:4px 9px;line-height:1.1;cursor:pointer}
.rate i{display:block;font-style:normal;font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim-2)}
.rate b{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--green-l)}
.rate.b b{color:var(--blue-l)}

main{max-width:900px;margin:0 auto;padding:16px 14px calc(var(--nav) + 26px)}
.view{animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h2.vt{font-size:22px;margin-bottom:14px}

/* ── Nav inferior ── */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(8,13,19,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:60px}
.nb{background:none;border:0;color:var(--dim-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 10px "Inter",sans-serif;cursor:pointer;transition:color .15s;padding:0}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="true"]{color:var(--green-l)}
.nb.plus{color:#04231A}
.nb.plus span{width:46px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--green),var(--blue));display:grid;place-items:center;box-shadow:0 4px 16px rgba(22,199,132,.28)}
.nb.plus svg{stroke-width:2.6;width:20px;height:20px}
.nb:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--blue-l);outline-offset:2px}

/* ── Hoja inferior ── */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
.sheet-card{position:relative;width:100%;max-width:900px;margin:0 auto;background:var(--surf);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.3,1) both;max-height:86vh;overflow:auto}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line-2);margin:6px auto 14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.mi{background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:13px;text-align:left;cursor:pointer;color:var(--txt);font:600 14px "Inter",sans-serif}
.mi small{display:block;font-weight:400;font-size:11.5px;color:var(--dim);margin-top:2px}
.mi:hover{border-color:var(--green-d)}
.mi[aria-current="true"]{border-color:var(--green);background:#08281F}

/* ── Bloques ── */
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--dim-2);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow:first-child{margin-top:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:linear-gradient(160deg,var(--surf-2),var(--surf));border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--blue)}
.kpi.gr::before{background:var(--green)}
.kpi.rd::before{background:var(--red)}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim-2)}
.kpi .big{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:-.04em;margin:5px 0 2px}
.kpi .big.gr{color:var(--green-l)}.kpi .big.bl{color:var(--blue-l)}.kpi .big.rd{color:var(--red)}
.kpi .sub{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.qbar{margin-top:8px;height:7px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--green))}
.bar{height:8px;background:var(--bg-2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar i.ok{background:var(--green)}.bar i.over{background:var(--red)}.bar i.warn{background:var(--orange)}

/* ── Formularios ── */
label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:0 0 5px}
input,select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line-2);color:var(--txt);border-radius:11px;padding:11px;font:500 16px "Inter",sans-serif}
input[inputmode],input[type=number]{font-family:var(--mono)}
textarea{resize:vertical;min-height:62px}
input::placeholder,textarea::placeholder{color:var(--dim-2)}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.f{margin-bottom:11px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:11px 18px;font:600 14.5px "Inter",sans-serif;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.13)}
.btn.g{background:var(--green);color:#04231A}
.btn.o{background:transparent;border:1px solid var(--line-2);color:var(--txt)}
.btn.d{background:transparent;border:1px solid #4A2027;color:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:99px;padding:5px 11px;font-size:13px}
.chip button{background:none;border:0;color:var(--dim-2);cursor:pointer;font-size:16px;line-height:1;padding:0}
.chip button:hover{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.badge{display:inline-block;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:99px;border:1px solid}
.b-red{color:var(--red);border-color:#4A2027;background:#2A1116}
.b-org{color:var(--orange);border-color:#4A3618;background:#2A1E0C}
.b-pur{color:var(--purple);border-color:#3A2B57;background:#1E1730}
.b-grn{color:var(--green-l);border-color:var(--green-d);background:#08281F}
.b-blu{color:var(--blue-l);border-color:var(--blue-d);background:#0B1E36}

/* ── Tarjeta desplegable ── */
.item{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.item.s-rojo{border-left-color:var(--red)}.item.s-naranja{border-left-color:var(--orange)}
.item.s-morado{border-left-color:var(--purple)}.item.s-verde{border-left-color:var(--green)}
.item>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:11px;align-items:center}
.item>summary::-webkit-details-marker{display:none}
.item[open]>summary{border-bottom:1px solid var(--line)}
.it-main{flex:1;min-width:0}
.it-name{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.it-meta{font-size:11px;color:var(--dim);margin-top:3px;font-family:var(--mono)}
.it-right{text-align:right;flex-shrink:0}
.it-price{font-family:var(--mono);font-weight:700;font-size:14px}
.it-price small{display:block;font-size:10.5px;font-weight:500;color:var(--dim)}
.life{height:5px;background:var(--bg-2);border-radius:99px;margin-top:7px;overflow:hidden}
.life i{display:block;height:100%;border-radius:99px;background:var(--green)}
.s-rojo .life i{background:var(--red)}.s-naranja .life i{background:var(--orange)}.s-morado .life i{background:var(--purple)}
.detail{padding:13px 14px;background:var(--bg-2)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:10px;margin-bottom:12px}
.dl div span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim-2)}
.dl div b{font-family:var(--mono);font-weight:700;font-size:13.5px}
.conv{display:flex;border:1px solid var(--line-2);border-radius:11px;overflow:hidden;margin-bottom:12px}
.conv div{flex:1;padding:8px 9px;border-right:1px solid var(--line-2)}
.conv div:last-child{border-right:0}
.conv span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--dim-2)}
.conv b{font-family:var(--mono);font-size:13.5px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim-2);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.best td{background:#08281F}

details.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:13px}
details.panel>summary{cursor:pointer;padding:12px 15px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{content:"▸";color:var(--green);transition:transform .18s;display:inline-block}
details.panel[open]>summary::before{transform:rotate(90deg)}
details.panel .body{padding:14px 15px 15px;border-top:1px solid var(--line)}

.empty{text-align:center;padding:34px 16px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--dim)}
.empty b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:16px;color:var(--txt);margin-bottom:5px}
.muted{color:var(--dim);font-size:12.5px}
.warn{background:#2A1E0C;border:1px solid #4A3618;color:#FFC97A;border-radius:11px;padding:10px 13px;font-size:13px;margin-bottom:13px}
.alert{background:#2A1116;border:1px solid #4A2027;color:#FFB0B8;border-radius:11px;padding:10px 13px;font-size:13px;margin-bottom:13px}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
.macro{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.macro span{font-family:var(--mono);font-size:11px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:7px;padding:3px 8px;color:var(--dim)}
.macro span b{color:var(--txt)}
.chk{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--surf);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.chk input[type=checkbox]{width:21px;height:21px;flex-shrink:0;accent-color:var(--green)}
.chk.on{opacity:.45}
.chk.on .cn{text-decoration:line-through}
.cn{flex:1;min-width:0;font-size:14px}
.cn small{display:block;color:var(--dim);font-size:11px;font-family:var(--mono)}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 14px);transform:translate(-50%,90px);background:var(--green);color:#04231A;font-weight:600;font-size:13.5px;padding:11px 20px;border-radius:99px;z-index:99;transition:transform .3s;pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.55);max-width:88vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
#toast.err{background:var(--red);color:#fff}
@media(max-width:420px){.hbar{gap:7px}.brand b{font-size:16px}.rate{padding:3px 7px}.kpi .big{font-size:21px}}
</style>
</head>
<body>

<header><div class="hbar">
  <div class="brand"><div class="mark">B</div><b>BlychFood</b></div>
  <div class="rates">
    <div class="rate b" onclick="ir('config')"><i>USD→Bs</i><b id="rBs">—</b></div>
    <div class="rate" onclick="ir('config')"><i>USD→COP</i><b id="rCop">—</b></div>
  </div>
</div></header>

<main id="app"></main>

<nav id="nav"><div class="navin">
  <button class="nb" data-v="inicio" onclick="ir('inicio')"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Inicio</button>
  <button class="nb" data-v="despensa" onclick="ir('despensa')"><svg viewBox="0 0 24 24"><path d="M4 8h16v13H4z"/><path d="M4 8l1.6-4h12.8L20 8"/><path d="M10 13h4"/></svg>Despensa</button>
  <button class="nb plus" onclick="ir('registrar')"><span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button class="nb" data-v="dietas" onclick="ir('dietas')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.4"/></svg>Dietas</button>
  <button class="nb" data-v="mas" onclick="abrirMas()"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>Más</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="sheet-bg" onclick="cerrarMas()"></div>
  <div class="sheet-card"><div class="grab"></div><h2 style="font-size:18px;margin-bottom:13px">Todo lo demás</h2><div class="mgrid" id="mgrid"></div></div></div>
<div class="sheet" id="aviso" hidden><div class="sheet-bg" onclick="cerrarAviso()"></div>
  <div class="sheet-card"><div class="grab"></div><div id="avisoBody"></div></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ═════════ 1. Datos ═════════ */
const KEY = "blychfood_v2", VIEJA = "despensa_v1";
const DEF = {
  alimentos:[], nutricion:{}, compras:[], dietas:[], recetas:[], precios:[], listaCompra:[], lugares:[], pesos:[],
  perfil:{ sexo:"H", edad:25, altura:172, peso:65, actividad:1.55, superavit:350, gProt:2, gGrasa:0.9, metaCal:0, metaProt:0, metaCarb:0, metaGrasa:0 },
  cfg:{
    tasaBs:0, tasaCop:0,
    categorias:["Proteína","Carbohidrato","Verdura","Fruta","Lácteo","Grasa","Bebida","Condimento","Snack","Otro"],
    metodos:["Efectivo Bs","Efectivo $","Pago móvil","Transferencia","Zelle","Débito","Crédito"],
    comidas:["Desayuno","Merienda AM","Almuerzo","Merienda PM","Cena"],
    tiposLugar:["Supermercado","Mercado popular","Carnicería","Charcutería","Bodega","Verdulería","Online","Mayorista"],
    campos:[], avisoVence:7, avisoDuracion:3, avisoGramos:100,
    presuMonto:0, presuMoneda:"USD", ultimoAviso:""
  }
};
let DB = cargar();

function clon(o){ return JSON.parse(JSON.stringify(o)); }
function cargar(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!raw){ try{ raw = JSON.parse(localStorage.getItem(VIEJA)); }catch(e){} }
  if(!raw) return clon(DEF);
  const d = clon(DEF);
  for(const k of Object.keys(DEF)){
    if(raw[k]===undefined) continue;
    if(k==="cfg"||k==="perfil") Object.assign(d[k], raw[k]);
    else d[k] = raw[k];
  }
  // Migración: lugares de texto → fichas de lugar
  if(raw.cfg && Array.isArray(raw.cfg.lugares) && raw.cfg.lugares.length && typeof raw.cfg.lugares[0]==="string"){
    d.lugares = raw.cfg.lugares.map(n=>({id:"l"+Math.random().toString(36).slice(2,8), nombre:n, tipo:"", zona:"", nota:""}));
  }
  delete d.cfg.lugares;
  if(!d.lugares.length) d.lugares = [{id:"l0",nombre:"Supermercado",tipo:"Supermercado",zona:"",nota:""}];
  d.compras.forEach(c=>{ if(!c.lugarId && c.lugar){ const l=d.lugares.find(x=>x.nombre===c.lugar); c.lugarId = l?l.id:null; } });
  return d;
}
function guardar(){ localStorage.setItem(KEY, JSON.stringify(DB)); }

/* ═════════ 2. Utilidades ═════════ */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s??"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const n0 = v => { const x = parseFloat(String(v).replace(",",".")); return isFinite(x)?x:0; };
const hoy = () => new Date().toISOString().slice(0,10);
function nf(v,d=2){ return (isFinite(v)?v:0).toLocaleString("es-VE",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function bs(v){ return nf(v,2)+" Bs"; }
function usd(v){ return "$"+nf(v,2); }
function cop(v){ return "COP "+nf(v,0); }
function aUsd(b){ return DB.cfg.tasaBs>0 ? b/DB.cfg.tasaBs : 0; }
function aCop(b){ return aUsd(b)*DB.cfg.tasaCop; }
function dias(a,b){ return Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/86400000); }
function sumaDias(f,d){ const x=new Date(f+"T00:00"); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); }
function fecha(f){ if(!f) return "—"; const [a,m,d]=f.split("-"); return `${d}/${m}/${a}`; }
function mesDe(f){ return (f||"").slice(0,7); }
function nomMes(m){ if(!m) return "—"; const [a,mm]=m.split("-"); return ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+mm-1]+" "+a; }
function toast(m,err){ const t=$("#toast"); t.textContent=m; t.className="on"+(err?" err":""); clearTimeout(t._t); t._t=setTimeout(()=>t.className="",2500); }
function opts(arr,sel){ return arr.map(o=>`<option value="${esc(o)}"${norm(o)===norm(sel)?" selected":""}>${esc(o)}</option>`).join(""); }
function optsId(arr,sel){ return arr.map(o=>`<option value="${o.id}"${o.id===sel?" selected":""}>${esc(o.nombre)}</option>`).join(""); }
function getAl(id){ return DB.alimentos.find(a=>a.id===id); }
function getLugar(id){ return DB.lugares.find(l=>l.id===id); }
function nomLugar(id){ const l=getLugar(id); return l?l.nombre:"—"; }
function spark(vals,color){
  if(vals.length<2) return "";
  const min=Math.min(...vals), max=Math.max(...vals), r=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*300},${52-((v-min)/r)*44}`).join(" ");
  return `<svg viewBox="0 0 300 60" width="100%" height="62" preserveAspectRatio="none" style="margin-top:8px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function estado(a){
  const c=DB.cfg, h=hoy(), tags=[]; let cls="verde";
  if(a.fVence){
    const dv=dias(h,a.fVence);
    if(dv<0){ tags.push(["Vencido hace "+Math.abs(dv)+" d","b-red"]); cls="rojo"; }
    else if(dv<=c.avisoVence){ tags.push(["Vence en "+dv+" d","b-red"]); cls="rojo"; }
  }
  if(a.gramosDisp<=0){ tags.push(["Agotado","b-pur"]); if(cls!=="rojo") cls="morado"; }
  else if(a.gramosDisp<=c.avisoGramos){ tags.push(["Quedan "+nf(a.gramosDisp,0)+" g","b-pur"]); if(cls!=="rojo") cls="morado"; }
  if(a.fCompra && a.dias>0){
    const dd=dias(h,sumaDias(a.fCompra,a.dias));
    if(dd<0) tags.push(["Duración excedida","b-org"]);
    else if(dd<=c.avisoDuracion) tags.push(["Fin de consumo en "+dd+" d","b-org"]);
    if(dd<=c.avisoDuracion && cls==="verde") cls="naranja";
  }
  if(!tags.length) tags.push(["En buen estado","b-grn"]);
  return {cls,tags};
}
function macrosDe(n){ return DB.nutricion[norm(n)]||null; }
function aporte(a){ const m=macrosDe(a.nombre); if(!m) return null; const f=a.gramosDisp/100;
  return {cal:m.cal*f, prot:m.prot*f, carb:m.carb*f, gras:m.gras*f}; }

/* Historial de precios */
function registrarPrecio(o){
  if(!(o.precioBs>0 && o.kg>0)) return;
  const bsKg=o.precioBs/o.kg, tasa=o.tasa>0?o.tasa:DB.cfg.tasaBs;
  DB.precios.push({ id:uid(), clave:norm(o.nombre), nombre:o.nombre, fecha:o.fecha||hoy(),
    bsKg, usdKg: tasa>0?bsKg/tasa:0, tasa, lugarId:o.lugarId||null });
}
function preciosDe(nom){ return DB.precios.filter(p=>p.clave===norm(nom)).sort((a,b)=>a.fecha.localeCompare(b.fecha)); }
function ultimoPrecio(nom){ const p=preciosDe(nom); return p.length?p[p.length-1]:null; }

/* ═════════ 3. Navegación ═════════ */
const MAS = [
  ["nutricion","Nutrición","Calorías y macros por alimento"],
  ["compras","Compras","Dónde, cómo y a qué tasa pagaste"],
  ["listaCompra","Lista de compras","Lo que se agota, listo para el mercado"],

  ["salud","Salud y volumen","Metas, peso y progreso"],

];
const V = {};
let vista="inicio", editando=null;

function ir(v){ vista=v; cerrarMas(); render(); window.scrollTo({top:0,behavior:"instant"}); }

/* ═════════ 4. Inicio ═════════ */
function gastoRango(d1,d2){
  let b=0,u=0;
  DB.compras.filter(c=>c.fecha>=d1&&c.fecha<=d2).forEach(c=>{ b+=n0(c.montoBs); u+=c.tasa>0?n0(c.montoBs)/c.tasa:aUsd(n0(c.montoBs)); });
  DB.alimentos.filter(a=>!a.compraId&&a.fCompra>=d1&&a.fCompra<=d2).forEach(a=>{ b+=n0(a.precioBs); u+=a.tasaCompra>0?n0(a.precioBs)/a.tasaCompra:aUsd(n0(a.precioBs)); });
  return {bs:b, usd:u};
}
function gastoMes(m){ const f=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(); return gastoRango(m+"-01", m+"-"+f); }
function mesesConDatos(){ const s=new Set();
  DB.compras.forEach(c=>c.fecha&&s.add(mesDe(c.fecha)));
  DB.alimentos.forEach(a=>!a.compraId&&a.fCompra&&s.add(mesDe(a.fCompra)));
  return [...s].sort(); }
function alertasActivas(){
  const c=DB.cfg, h=hoy(), r={vencen:[], agotan:[], presu:null};
  DB.alimentos.forEach(a=>{
    if(a.fVence && dias(h,a.fVence)<=c.avisoVence) r.vencen.push(a);
    else if(a.gramosDisp<=c.avisoGramos) r.agotan.push(a);
  });
  r.vencen.sort((a,b)=>(a.fVence||"").localeCompare(b.fVence||""));
  if(c.presuMonto>0){
    const g=gastoMes(hoy().slice(0,7));
    const usado = c.presuMoneda==="USD"?g.usd:g.bs;
    const pct = usado/c.presuMonto*100;
    r.presu = {usado, pct, monto:c.presuMonto, mon:c.presuMoneda};
  }
  return r;
}
function mostrarAvisoDiario(){
  if(DB.cfg.ultimoAviso===hoy()) return;
  const A=alertasActivas();
  const hayPresu = A.presu && A.presu.pct>=85;
  if(!A.vencen.length && !A.agotan.length && !hayPresu){ DB.cfg.ultimoAviso=hoy(); guardar(); return; }
  const li = a => `<div class="chk"><div class="cn">${esc(a.nombre)}<small>${a.fVence?"vence "+fecha(a.fVence)+" · ":""}${nf(a.gramosDisp,0)} g disponibles</small></div></div>`;
  $("#avisoBody").innerHTML = `
    <h2 style="font-size:19px;margin-bottom:4px">Al día de hoy</h2>
    <p class="muted" style="margin:0 0 14px">${fecha(hoy())}</p>
    ${hayPresu?`<div class="${A.presu.pct>=100?"alert":"warn"}">Llevas <b>${A.presu.mon==="USD"?usd(A.presu.usado):bs(A.presu.usado)}</b> de tu presupuesto de ${A.presu.mon==="USD"?usd(A.presu.monto):bs(A.presu.monto)} · ${nf(A.presu.pct,0)}%</div>`:""}
    ${A.vencen.length?`<div class="eyebrow">Vencen pronto · ${A.vencen.length}</div>${A.vencen.slice(0,6).map(li).join("")}`:""}
    ${A.agotan.length?`<div class="eyebrow">Casi agotados · ${A.agotan.length}</div>${A.agotan.slice(0,6).map(li).join("")}`:""}
    <div class="btns" style="margin-top:14px">
      <button class="btn g" onclick="cerrarAviso()">Entendido</button>
      <button class="btn o" onclick="cerrarAviso();ir('listaCompra')">Ver lista de compras</button>
    </div>`;
  $("#aviso").hidden=false;
}
function cerrarAviso(){ $("#aviso").hidden=true; DB.cfg.ultimoAviso=hoy(); guardar(); }

V.inicio = function(){
  const m=hoy().slice(0,7), fin=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
  const g=gastoMes(m), q1=gastoRango(m+"-01",m+"-15"), q2=gastoRango(m+"-16",m+"-"+fin);
  const ms=mesesConDatos();
  const promU = ms.length?ms.reduce((s,x)=>s+gastoMes(x).usd,0)/ms.length:0;
  const promB = ms.length?ms.reduce((s,x)=>s+gastoMes(x).bs,0)/ms.length:0;
  const tot=g.bs||1, A=alertasActivas(), P=DB.perfil;

  const porCat={};
  DB.alimentos.filter(a=>mesDe(a.fCompra)===m).forEach(a=>{ const k=a.categoria||"Sin categoría"; porCat[k]=(porCat[k]||0)+n0(a.precioBs); });
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,6), maxCat=cats.length?cats[0][1]:1;

  const valorBs=DB.alimentos.reduce((s,a)=>s+(a.gramosIni>0?n0(a.precioBs)*(a.gramosDisp/a.gramosIni):0),0);
  const calDisp=DB.alimentos.reduce((s,a)=>{const p=aporte(a);return s+(p?p.cal:0)},0);
  const conHoy={cal:0,prot:0,carb:0,gras:0};
  DB.dietas.filter(d=>d.fecha===hoy()).forEach(d=>d.items.forEach(i=>{conHoy.cal+=i.cal;conHoy.prot+=i.prot;conHoy.carb+=i.carb;conHoy.gras+=i.gras}));

  const atencion=DB.alimentos.map(a=>({a,e:estado(a)})).filter(x=>x.e.cls!=="verde")
    .sort((x,y)=>({rojo:0,morado:1,naranja:2})[x.e.cls]-({rojo:0,morado:1,naranja:2})[y.e.cls]).slice(0,8);

  return `<h2 class="vt">Hola, ${fecha(hoy())}</h2>
  ${DB.cfg.tasaBs<=0?`<div class="warn">Falta la tasa del día. Cárgala en <b>Configuración</b> para ver las conversiones.</div>`:""}
  ${A.presu?`<div class="card" style="margin-bottom:13px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="lbl">Presupuesto de ${nomMes(m)}</span>
      <span class="num" style="font-size:13px;color:${A.presu.pct>100?"var(--red)":A.presu.pct>85?"var(--orange)":"var(--green-l)"}">${nf(A.presu.pct,0)}%</span></div>
    <div style="font-family:var(--mono);font-size:18px;font-weight:700;margin-top:5px">
      ${A.presu.mon==="USD"?usd(A.presu.usado):bs(A.presu.usado)} <span class="muted">de ${A.presu.mon==="USD"?usd(A.presu.monto):bs(A.presu.monto)}</span></div>
    <div class="bar"><i class="${A.presu.pct>100?"over":A.presu.pct>85?"warn":"ok"}" style="width:${Math.min(100,A.presu.pct)}%"></i></div>
    ${A.presu.pct>100?`<p class="muted" style="margin:7px 0 0;color:var(--red)">Te pasaste por ${A.presu.mon==="USD"?usd(A.presu.usado-A.presu.monto):bs(A.presu.usado-A.presu.monto)}.</p>`:
      `<p class="muted" style="margin:7px 0 0">Te quedan ${A.presu.mon==="USD"?usd(A.presu.monto-A.presu.usado):bs(A.presu.monto-A.presu.usado)} este mes.</p>`}
  </div>`:""}

  <div class="eyebrow">Gasto en mercado</div>
  <div class="grid g2">
    <div class="kpi gr"><div class="lbl">Promedio mensual</div><div class="big gr">${usd(promU)}</div><div class="sub">${bs(promB)} · ${ms.length} ${ms.length===1?"mes":"meses"}</div></div>
    <div class="kpi"><div class="lbl">Total neto · ${nomMes(m)}</div><div class="big bl">${bs(g.bs)}</div><div class="sub">${usd(g.usd)} · ${cop(aCop(g.bs))}</div></div>
    <div class="kpi"><div class="lbl">Quincena 1 · 1 al 15</div><div class="big">${bs(q1.bs)}</div><div class="sub">${usd(q1.usd)}</div><div class="qbar"><i style="width:${Math.min(100,q1.bs/tot*100)}%"></i></div></div>
    <div class="kpi gr"><div class="lbl">Quincena 2 · 16 al ${fin}</div><div class="big">${bs(q2.bs)}</div><div class="sub">${usd(q2.usd)}</div><div class="qbar"><i style="width:${Math.min(100,q2.bs/tot*100)}%"></i></div></div>
  </div>

  <div class="eyebrow">Tu despensa ahora</div>
  <div class="grid g4">
    <div class="card"><div class="lbl">Valor restante</div><div class="num" style="font-size:19px;font-weight:700;margin-top:4px">${bs(valorBs)}</div><div class="muted">${usd(aUsd(valorBs))}</div></div>
    <div class="card"><div class="lbl">Alimentos activos</div><div class="num" style="font-size:19px;font-weight:700;margin-top:4px">${DB.alimentos.filter(a=>a.gramosDisp>0).length}</div><div class="muted">de ${DB.alimentos.length}</div></div>
    <div class="card"><div class="lbl">Calorías disponibles</div><div class="num" style="font-size:19px;font-weight:700;margin-top:4px">${nf(calDisp,0)}</div><div class="muted">kcal</div></div>
    <div class="card"><div class="lbl">Por comprar</div><div class="num" style="font-size:19px;font-weight:700;margin-top:4px">${DB.listaCompra.filter(x=>!x.hecho).length+A.agotan.length}</div><div class="muted">artículos pendientes</div></div>
  </div>

  ${P.metaCal>0?`<div class="eyebrow">Consumo de hoy</div><div class="card">
    ${["cal|Calorías|kcal","prot|Proteínas|g","carb|Carbohidratos|g","gras|Grasas|g"].map(x=>{
      const [k,l,u]=x.split("|"), meta={cal:P.metaCal,prot:P.metaProt,carb:P.metaCarb,gras:P.metaGrasa}[k], pct=meta>0?conHoy[k]/meta*100:0;
      return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${l}</span><span class="num">${nf(conHoy[k],0)} / ${nf(meta,0)} ${u}</span></div>
      <div class="bar"><i class="${pct>=95&&pct<=110?"ok":pct>110?"warn":""}" style="width:${Math.min(100,pct)}%"></i></div></div>`}).join("")}
  </div>`:""}

  ${cats.length?`<div class="eyebrow">Gasto por categoría · ${nomMes(m)}</div><div class="card">
    ${cats.map(([c,v])=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(c)}</span><span class="num">${bs(v)}</span></div>
    <div class="bar"><i style="width:${v/maxCat*100}%"></i></div></div>`).join("")}</div>`:""}

  <div class="eyebrow">Requiere atención</div>
  ${atencion.length?atencion.map(({a,e})=>`<div class="item s-${e.cls}"><div style="padding:12px 14px;display:flex;gap:11px;align-items:center" onclick="ir('despensa')">
    <div class="it-main"><div class="it-name">${esc(a.nombre)} ${e.tags.map(t=>`<span class="badge ${t[1]}">${t[0]}</span>`).join(" ")}</div>
    <div class="it-meta">${nf(a.gramosDisp,0)} g · vence ${fecha(a.fVence)}</div></div></div></div>`).join("")
   :`<div class="empty"><b>Todo en orden</b>Nada por vencerse ni por agotarse.</div>`}`;
};

/* ═════════ 5. Despensa ═════════ */
let filtros={q:"",cat:"",est:"",lugar:"",desde:"",hasta:"",orden:"compra-desc",extras:{}};

V.despensa = function(){
  const c=DB.cfg;
  const camposHTML=c.campos.map(f=>{
    const v=filtros.extras[f.id]||"";
    return f.tipo==="seleccion"
      ? `<div class="f"><label>${esc(f.label)}</label><select onchange="filtros.extras['${f.id}']=this.value;render()"><option value="">Todos</option>${opts(f.opciones||[],v)}</select></div>`
      : `<div class="f"><label>${esc(f.label)}</label><input value="${esc(v)}" placeholder="Contiene…" oninput="filtros.extras['${f.id}']=this.value;deb(render)"></div>`;
  }).join("");

  let L=DB.alimentos.slice();
  const q=norm(filtros.q);
  if(q) L=L.filter(a=>norm(a.nombre).includes(q)||norm(a.categoria).includes(q)||norm(nomLugar(a.lugarId)).includes(q)||Object.values(a.extras||{}).some(v=>norm(v).includes(q)));
  if(filtros.cat) L=L.filter(a=>a.categoria===filtros.cat);
  if(filtros.est) L=L.filter(a=>estado(a).cls===filtros.est);
  if(filtros.lugar) L=L.filter(a=>a.lugarId===filtros.lugar);
  if(filtros.desde) L=L.filter(a=>a.fCompra>=filtros.desde);
  if(filtros.hasta) L=L.filter(a=>a.fCompra<=filtros.hasta);
  for(const [k,v] of Object.entries(filtros.extras)){ if(v) L=L.filter(a=>norm((a.extras||{})[k]).includes(norm(v))); }
  const ord={"compra-desc":(a,b)=>(b.fCompra||"").localeCompare(a.fCompra||""),"compra-asc":(a,b)=>(a.fCompra||"").localeCompare(b.fCompra||""),
    "vence":(a,b)=>(a.fVence||"9999").localeCompare(b.fVence||"9999"),"nombre":(a,b)=>a.nombre.localeCompare(b.nombre),
    "precio":(a,b)=>n0(b.precioBs)-n0(a.precioBs),"gramos":(a,b)=>a.gramosDisp-b.gramosDisp};
  L.sort(ord[filtros.orden]);
  const totalBs=L.reduce((s,a)=>s+n0(a.precioBs),0);
  const activo=filtros.q||filtros.cat||filtros.est||filtros.lugar||filtros.desde||filtros.hasta;

  return `<h2 class="vt">Despensa</h2>
  <details class="panel"${activo?" open":""}>
    <summary>Buscar y filtrar${L.length!==DB.alimentos.length?` · ${L.length} de ${DB.alimentos.length}`:""}</summary>
    <div class="body">
      <div class="f"><label>Buscar</label><input value="${esc(filtros.q)}" placeholder="Nombre, categoría o lugar…" oninput="filtros.q=this.value;deb(render)"></div>
      <div class="grid g3">
        <div class="f"><label>Categoría</label><select onchange="filtros.cat=this.value;render()"><option value="">Todas</option>${opts(c.categorias,filtros.cat)}</select></div>
        <div class="f"><label>Estado</label><select onchange="filtros.est=this.value;render()"><option value="">Todos</option>
          ${Object.entries({rojo:"Rojo · por vencer",morado:"Morado · casi agotado",naranja:"Naranja · fin de consumo",verde:"Verde · en buen estado"}).map(([v,l])=>`<option value="${v}"${filtros.est===v?" selected":""}>${l}</option>`).join("")}</select></div>
        <div class="f"><label>Lugar de compra</label><select onchange="filtros.lugar=this.value;render()"><option value="">Todos</option>${optsId(DB.lugares,filtros.lugar)}</select></div>
        <div class="f"><label>Ordenar por</label><select onchange="filtros.orden=this.value;render()">
          ${Object.entries({"compra-desc":"Compra más reciente","compra-asc":"Compra más antigua","vence":"Vence primero","nombre":"Nombre A-Z","precio":"Precio mayor","gramos":"Menos disponible"}).map(([v,l])=>`<option value="${v}"${filtros.orden===v?" selected":""}>${l}</option>`).join("")}</select></div>
        <div class="f"><label>Comprado desde</label><input type="date" value="${filtros.desde}" onchange="filtros.desde=this.value;render()"></div>
        <div class="f"><label>Comprado hasta</label><input type="date" value="${filtros.hasta}" onchange="filtros.hasta=this.value;render()"></div>
        ${camposHTML}
      </div>
      <button class="btn o sm" onclick="filtros={q:'',cat:'',est:'',lugar:'',desde:'',hasta:'',orden:'compra-desc',extras:{}};render()">Limpiar filtros</button>
    </div>
  </details>
  ${L.length?`<div class="muted" style="margin-bottom:9px">${L.length} alimento(s) · ${bs(totalBs)} · ${usd(aUsd(totalBs))}</div>`:""}
  ${L.length?L.map(itemHTML).join(""):`<div class="empty"><b>Sin resultados</b>${DB.alimentos.length?"Ajusta los filtros.":"Toca el botón + para registrar tu primer alimento."}</div>`}`;
};
let _t; function deb(fn){ clearTimeout(_t); _t=setTimeout(fn,330); }

function itemHTML(a){
  const e=estado(a), pct=a.gramosIni>0?Math.max(0,Math.min(100,a.gramosDisp/a.gramosIni*100)):0;
  const m=macrosDe(a.nombre), ap=aporte(a);
  const finC=a.fCompra&&a.dias>0?sumaDias(a.fCompra,a.dias):"";
  const porKg=a.cantidadKg>0?n0(a.precioBs)/a.cantidadKg:0;
  const extras=(DB.cfg.campos||[]).filter(f=>(a.extras||{})[f.id]).map(f=>`<div><span>${esc(f.label)}</span><b>${esc(a.extras[f.id])}</b></div>`).join("");
  return `<details class="item s-${e.cls}">
    <summary><div class="it-main">
      <div class="it-name">${esc(a.nombre)} ${e.tags.map(t=>`<span class="badge ${t[1]}">${t[0]}</span>`).join(" ")}</div>
      <div class="it-meta">${esc(a.categoria||"Sin categoría")} · ${nf(a.gramosDisp,0)}/${nf(a.gramosIni,0)} g · ${fecha(a.fCompra)}</div>
      <div class="life"><i style="width:${pct}%"></i></div></div>
      <div class="it-right"><div class="it-price">${bs(n0(a.precioBs))}<small>${usd(aUsd(n0(a.precioBs)))}</small></div></div>
    </summary>
    <div class="detail">
      <div class="conv"><div><span>Bolívares</span><b>${nf(n0(a.precioBs),2)}</b></div>

        <div><span>Pesos</span><b style="color:var(--blue-l)">${cop(aCop(n0(a.precioBs)))}</b></div></div>
      <div class="dl">
        <div><span>Cantidad comprada</span><b>${nf(a.cantidadKg,3)} kg</b></div>
        <div><span>Disponible</span><b>${nf(a.gramosDisp,0)} g</b></div>
        <div><span>Precio por kg</span><b>${nf(porKg,2)} Bs</b></div>
        <div><span>Duración estimada</span><b>${a.dias||0} días</b></div>
        <div><span>Fin de consumo</span><b>${fecha(finC)}</b></div>
        <div><span>Comidas que da</span><b>${a.comidas||0}</b></div>
        <div><span>Fecha de compra</span><b>${fecha(a.fCompra)}</b></div>
        <div><span>Vencimiento</span><b>${fecha(a.fVence)}</b></div>
        <div><span>Lugar</span><b style="font-size:12px">${esc(nomLugar(a.lugarId))}</b></div>
        <div><span>Tasa de compra</span><b>${a.tasaCompra>0?nf(a.tasaCompra,2):"—"}</b></div>
        ${extras}</div>
      ${m?`<div class="muted">Aporte disponible · ${nf(ap.cal,0)} kcal</div><div class="macro">
        <span>P <b>${nf(ap.prot,1)} g</b></span><span>C <b>${nf(ap.carb,1)} g</b></span><span>G <b>${nf(ap.gras,1)} g</b></span>
        <span>por 100 g <b>${nf(m.cal,0)} kcal</b></span></div>`
      :`<div class="muted">Sin datos nutricionales. <a href="#" onclick="event.preventDefault();nutriPara('${a.id}')">Agregar macros</a></div>`}
      <div class="btns" style="margin-top:13px">
        <button class="btn sm" onclick="editarAl('${a.id}')">Editar</button>
        <button class="btn g sm" onclick="descontar('${a.id}')">Descontar</button>
        <button class="btn o sm" onclick="verPrecios('${esc(a.nombre).replace(/'/g,"\\'")}')">Precios</button>
        <button class="btn o sm" onclick="aLista('${esc(a.nombre).replace(/'/g,"\\'")}')">A la lista</button>
        <button class="btn d sm" onclick="borrarAl('${a.id}')">Borrar</button>
      </div>
    </div></details>`;
}
function descontar(id){
  const a=getAl(id); if(!a) return;
  const g=prompt(`¿Cuántos gramos descuentas de ${a.nombre}?\nDisponible: ${nf(a.gramosDisp,0)} g`,"100");
  if(g===null) return;
  const v=n0(g); if(v<=0) return toast("Escribe una cantidad mayor a cero",true);
  a.gramosDisp=Math.max(0,a.gramosDisp-v); guardar(); render(); toast(`Descontaste ${nf(v,0)} g`);
}
function borrarAl(id){
  const a=getAl(id); if(!a) return;
  if(!confirm(`Se borra "${a.nombre}" de la despensa.\nSus macros y su historial de precios quedan guardados: si lo vuelves a registrar, se cargan solos.\n\n¿Continuar?`)) return;
  DB.alimentos=DB.alimentos.filter(x=>x.id!==id); guardar(); render(); toast("Alimento borrado");
}
function editarAl(id){ editando=id; ir("registrar"); }

/* ═════════ 6. Registrar alimento ═════════ */
V.registrar = function(){
  const a=editando?getAl(editando):null, c=DB.cfg;
  const campos=c.campos.map(f=>{
    const v=a?(a.extras||{})[f.id]||"":"";
    const inp=f.tipo==="seleccion"?`<select id="x_${f.id}"><option value="">—</option>${opts(f.opciones||[],v)}</select>`
      :`<input id="x_${f.id}" type="${f.tipo==="numero"?"number":f.tipo==="fecha"?"date":"text"}" value="${esc(v)}">`;
    return `<div class="f"><label>${esc(f.label)}</label>${inp}</div>`;
  }).join("");
  return `<h2 class="vt">${a?"Editar alimento":"Nuevo alimento"}</h2>
  <div class="card"><div class="grid g2">
    <div class="f"><label>Nombre del alimento</label><input id="fNombre" value="${a?esc(a.nombre):""}" placeholder="Ej: Pechuga de pollo" oninput="pista()"></div>
    <div class="f"><label>Categoría</label><select id="fCat">${opts(c.categorias,a?a.categoria:"")}</select></div>
    <div class="f"><label>Precio costo (Bs)</label><input id="fPrecio" inputmode="decimal" value="${a?a.precioBs:""}" placeholder="0,00" oninput="pista()"></div>
    <div class="f"><label>Tasa usada (Bs por $)</label><input id="fTasa" inputmode="decimal" value="${a?a.tasaCompra:(c.tasaBs||"")}" oninput="pista()"></div>
    <div class="f"><label>Cantidad comprada (kg)</label><input id="fKg" inputmode="decimal" value="${a?a.cantidadKg:""}" placeholder="1,5" oninput="pista()"></div>
    <div class="f"><label>Disponible ahora (g)</label><input id="fDisp" inputmode="decimal" value="${a?a.gramosDisp:""}" placeholder="se calcula solo"></div>
    <div class="f"><label>Duración estimada (días)</label><input id="fDias" inputmode="numeric" value="${a?a.dias:""}" placeholder="15"></div>
    <div class="f"><label>Comidas que da</label><input id="fComidas" inputmode="numeric" value="${a?a.comidas:""}" placeholder="10"></div>
    <div class="f"><label>Lugar de compra</label><select id="fLugar">${optsId(DB.lugares,a?a.lugarId:"")}</select></div>
    <div class="f"><label>Fecha de compra</label><input id="fCompra" type="date" value="${a?a.fCompra:hoy()}"></div>
    <div class="f"><label>Fecha de vencimiento</label><input id="fVence" type="date" value="${a?a.fVence:""}"></div>
    ${campos}</div>
    <div id="pista" class="muted"></div>
    <div class="btns" style="margin-top:13px">
      <button class="btn g" onclick="guardarAl()">${a?"Guardar cambios":"Registrar alimento"}</button>
      ${a?`<button class="btn o" onclick="editando=null;ir('despensa')">Cancelar</button>`:""}</div>
  </div>
  <p class="muted" style="margin-top:11px">¿Falta un dato? Créalo en <a href="#" onclick="event.preventDefault();ir('config')">Configuración</a>: aparece aquí y en el buscador. ¿Falta un lugar? Agrégalo en <a href="#" onclick="event.preventDefault();ir('lugares')">Lugares</a>.</p>`;
};
function postRegistrar(){ pista(); }
function pista(){
  const el=$("#pista"); if(!el) return;
  const nom=$("#fNombre").value, m=macrosDe(nom), up=ultimoPrecio(nom);
  const p=n0($("#fPrecio").value), t=n0($("#fTasa").value)||DB.cfg.tasaBs, kg=n0($("#fKg").value);
  const x=[];
  if(p>0&&t>0) x.push(`<b class="num">${usd(p/t)}</b> · <b class="num">${cop(p/t*DB.cfg.tasaCop)}</b>`);
  if(p>0&&kg>0){
    const usdKg=t>0?(p/kg)/t:0;
    x.push(`${nf(p/kg,2)} Bs/kg`);
    if(up&&up.usdKg>0&&usdKg>0){
      const d=(usdKg-up.usdKg)/up.usdKg*100;
      x.push(`<span class="badge ${d>3?"b-red":d<-3?"b-grn":"b-blu"}">${d>=0?"+":""}${nf(d,1)}% vs ${fecha(up.fecha)}</span>`);
    }
  }
  if(m) x.push(`<span class="badge b-grn">Macros guardados: ${nf(m.cal,0)} kcal/100 g</span>`);
  el.innerHTML=x.join(" &nbsp;·&nbsp; ");
}
function guardarAl(){
  const nom=$("#fNombre").value.trim();
  if(!nom) return toast("Escribe el nombre del alimento",true);
  const kg=n0($("#fKg").value), dispIn=$("#fDisp").value.trim(), extras={};
  DB.cfg.campos.forEach(f=>{ const el=$("#x_"+f.id); if(el&&el.value) extras[f.id]=el.value; });
  const base={ nombre:nom, categoria:$("#fCat").value, precioBs:n0($("#fPrecio").value), tasaCompra:n0($("#fTasa").value),
    cantidadKg:kg, dias:n0($("#fDias").value), comidas:n0($("#fComidas").value), lugarId:$("#fLugar").value||null,
    fCompra:$("#fCompra").value||hoy(), fVence:$("#fVence").value, gramosIni:kg*1000, extras };
  if(editando){
    const a=getAl(editando); Object.assign(a,base);
    a.gramosDisp = dispIn!=="" ? n0(dispIn) : Math.min(a.gramosDisp, kg*1000);
    editando=null; guardar(); ir("despensa"); toast("Cambios guardados");
  }else{
    base.id=uid(); base.creado=Date.now(); base.compraId=null;
    base.gramosDisp = dispIn!=="" ? n0(dispIn) : kg*1000;
    DB.alimentos.push(base);
    registrarPrecio({nombre:nom, precioBs:base.precioBs, kg, tasa:base.tasaCompra, fecha:base.fCompra, lugarId:base.lugarId});
    guardar();
    const tm=!!macrosDe(nom); ir("despensa");
    toast(tm?"Registrado · macros cargados solos":"Alimento registrado");
  }
}

/* ═════════ 7. Nutrición ═════════ */
let nutriSel="";
function nutriPara(id){ const a=getAl(id); nutriSel=a?a.nombre:""; ir("nutricion"); }
V.nutricion = function(){
  const nombres=[...new Set(DB.alimentos.map(a=>a.nombre))].sort((a,b)=>a.localeCompare(b));
  const claves=Object.keys(DB.nutricion).sort((a,b)=>DB.nutricion[a].nombre.localeCompare(DB.nutricion[b].nombre));
  return `<h2 class="vt">Nutrición</h2>
  <p class="muted" style="margin:-6px 0 13px">Los macros se guardan por nombre y sobreviven al borrado: si borras "Avena" y mañana registras otra, sus calorías vuelven solas.</p>
  <div class="card">
    <div class="grid g2">
      <div class="f"><label>Alimento registrado</label><select id="nSel" onchange="cargarNutri()"><option value="">— Escribir uno nuevo —</option>${opts(nombres,nutriSel)}</select></div>
      <div class="f"><label>O escribe el nombre</label><input id="nNombre" value="${esc(nutriSel)}" placeholder="Ej: Avena en hojuelas" oninput="cargarPorNombre()"></div></div>
    <div class="eyebrow">Por cada 100 g</div>
    <div class="grid g4">
      <div class="f"><label>Calorías (kcal)</label><input id="n100c" inputmode="decimal" oninput="calcTot()"></div>
      <div class="f"><label>Proteínas (g)</label><input id="n100p" inputmode="decimal" oninput="calcTot()"></div>
      <div class="f"><label>Carbohidratos (g)</label><input id="n100h" inputmode="decimal" oninput="calcTot()"></div>
      <div class="f"><label>Grasas (g)</label><input id="n100g" inputmode="decimal" oninput="calcTot()"></div></div>
    <div class="eyebrow">Totales del paquete</div>
    <div class="f" style="max-width:230px"><label>Para esta cantidad (g)</label><input id="nPeso" inputmode="decimal" value="1000" oninput="calcTot()"></div>
    <div class="grid g4">
      <div class="f"><label>Calorías totales</label><input id="ntc" inputmode="decimal" oninput="calc100()"></div>
      <div class="f"><label>Proteínas totales</label><input id="ntp" inputmode="decimal" oninput="calc100()"></div>
      <div class="f"><label>Carbohidratos totales</label><input id="nth" inputmode="decimal" oninput="calc100()"></div>
      <div class="f"><label>Grasas totales</label><input id="ntg" inputmode="decimal" oninput="calc100()"></div></div>
    <p class="muted">Escribe en cualquiera de los dos bloques: el otro se completa solo.</p>
    <button class="btn g full" style="margin-top:10px" onclick="guardarNutri()">Guardar en la base</button>
  </div>
  <div class="eyebrow">Con macros guardados · ${claves.length}</div>
  ${claves.length?`<div class="card scroll"><table><tr><th>Alimento</th><th>kcal</th><th>P</th><th>C</th><th>G</th><th></th></tr>
    ${claves.map(k=>{const m=DB.nutricion[k];return `<tr><td>${esc(m.nombre)}${DB.alimentos.some(a=>norm(a.nombre)===k)?' <span class="badge b-blu">en despensa</span>':''}</td>
    <td class="n">${nf(m.cal,0)}</td><td class="n">${nf(m.prot,1)}</td><td class="n">${nf(m.carb,1)}</td><td class="n">${nf(m.gras,1)}</td>
    <td><button class="btn o sm" onclick="nutriSel='${esc(m.nombre).replace(/'/g,"\\'")}';render()">Editar</button>
        <button class="btn d sm" onclick="borrarNutri('${k}')">Borrar</button></td></tr>`}).join("")}</table>
    <p class="muted" style="margin-top:9px">Valores por cada 100 g.</p></div>`
  :`<div class="empty"><b>Base vacía</b>Guarda los macros para que las dietas calculen solas.</div>`}`;
};
function postNutricion(){ if(nutriSel) cargarPorNombre(); }
function cargarNutri(){ const v=$("#nSel").value; if(v) $("#nNombre").value=v; cargarPorNombre(); }
function cargarPorNombre(){
  const m=macrosDe($("#nNombre").value);
  $("#n100c").value=m?m.cal:""; $("#n100p").value=m?m.prot:""; $("#n100h").value=m?m.carb:""; $("#n100g").value=m?m.gras:"";
  const al=DB.alimentos.find(a=>norm(a.nombre)===norm($("#nNombre").value));
  if(al&&al.gramosIni>0) $("#nPeso").value=al.gramosIni;
  calcTot();
}
function calcTot(){ const f=n0($("#nPeso").value)/100;
  [["n100c","ntc"],["n100p","ntp"],["n100h","nth"],["n100g","ntg"]].forEach(([a,b])=>{ const v=$(a).value; $(b).value=v===""?"":+(n0(v)*f).toFixed(2); }); }
function calc100(){ const f=n0($("#nPeso").value)/100; if(f<=0) return;
  [["n100c","ntc"],["n100p","ntp"],["n100h","nth"],["n100g","ntg"]].forEach(([a,b])=>{ const v=$(b).value; $(a).value=v===""?"":+(n0(v)/f).toFixed(2); }); }
function guardarNutri(){
  const nom=$("#nNombre").value.trim(); if(!nom) return toast("Falta el nombre",true);
  DB.nutricion[norm(nom)]={nombre:nom,cal:n0($("#n100c").value),prot:n0($("#n100p").value),carb:n0($("#n100h").value),gras:n0($("#n100g").value)};
  guardar(); nutriSel=nom; render(); toast("Macros guardados para "+nom);
}
function borrarNutri(k){ if(!confirm(`Se borran los macros de "${DB.nutricion[k].nombre}". ¿Continuar?`)) return;
  delete DB.nutricion[k]; guardar(); render(); toast("Macros borrados"); }

/* ═════════ 8. Compras ═════════ */
let itemsCompra=[];
V.compras = function(){
  const c=DB.cfg, m=hoy().slice(0,7);
  const totMes=DB.compras.filter(x=>mesDe(x.fecha)===m).reduce((s,x)=>s+n0(x.montoBs),0);
  const libres=DB.alimentos.filter(a=>!a.compraId);
  return `<h2 class="vt">Compras</h2>
  <div class="card">
    <div class="grid g2">
      <div class="f"><label>Fecha</label><input id="cFecha" type="date" value="${hoy()}"></div>
      <div class="f"><label>Lugar de la compra</label><select id="cLugar">${optsId(DB.lugares,"")}</select></div>
      <div class="f"><label>Método de pago</label><select id="cMetodo">${opts(c.metodos,"")}</select></div>
      <div class="f"><label>Tasa usada (Bs por $)</label><input id="cTasa" inputmode="decimal" value="${c.tasaBs||""}" oninput="totCompra()"></div>
      <div class="f"><label>Monto total (Bs)</label><input id="cMonto" inputmode="decimal" placeholder="0,00" oninput="totCompra()"></div>
      <div class="f"><label>Nota</label><input id="cNota" placeholder="Compra quincenal…"></div></div>
    <div id="cConv" class="muted"></div>
    <div class="eyebrow">Qué compré</div>
    ${libres.length?`<div class="grid g3" style="align-items:end">
      <div class="f"><label>Alimento registrado</label><select id="cAl">${opts(libres.map(a=>a.nombre),"")}</select></div>
      <div class="f"><label>Cantidad (kg)</label><input id="cKg" inputmode="decimal" placeholder="1"></div>
      <div class="f"><button class="btn sm full" onclick="addItemReg()">Agregar</button></div></div>`
     :`<p class="muted">No hay alimentos sin compra asociada. Agrega artículos sueltos abajo.</p>`}
    <div class="grid g3" style="align-items:end">
      <div class="f"><label>Artículo suelto</label><input id="cLibre" placeholder="Ej: jabón, bolsas"></div>
      <div class="f"><label>Monto (Bs)</label><input id="cLibreBs" inputmode="decimal" placeholder="0,00"></div>
      <div class="f"><button class="btn o sm full" onclick="addItemLibre()">Agregar suelto</button></div></div>
    <div id="cItems"></div>
    <button class="btn g full" style="margin-top:12px" onclick="guardarCompra()">Guardar compra</button>
  </div>
  <div class="eyebrow">Compras de ${nomMes(m)} · ${bs(totMes)}</div>
  ${DB.compras.length?DB.compras.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(x=>`
    <details class="item s-verde"><summary>
      <div class="it-main"><div class="it-name">${esc(nomLugar(x.lugarId)||x.lugar||"Sin lugar")}</div>
      <div class="it-meta">${fecha(x.fecha)} · ${esc(x.metodo||"—")} · ${x.items.length} artículo(s)</div></div>
      <div class="it-right"><div class="it-price">${bs(n0(x.montoBs))}<small>${usd(x.tasa>0?n0(x.montoBs)/x.tasa:aUsd(n0(x.montoBs)))}</small></div></div></summary>
      <div class="detail"><div class="dl">
        <div><span>Tasa aplicada</span><b>${x.tasa>0?nf(x.tasa,2):"—"}</b></div>
        <div><span>En pesos</span><b>${cop((x.tasa>0?n0(x.montoBs)/x.tasa:aUsd(n0(x.montoBs)))*DB.cfg.tasaCop)}</b></div>
        ${x.nota?`<div><span>Nota</span><b style="font-size:12px">${esc(x.nota)}</b></div>`:""}</div>
      ${x.items.length?`<div class="scroll"><table><tr><th>Artículo</th><th>Cantidad</th><th>Monto</th></tr>
        ${x.items.map(i=>`<tr><td>${esc(i.nombre)}</td><td class="n">${i.kg?nf(i.kg,3)+" kg":"—"}</td><td class="n">${i.bs?bs(i.bs):"—"}</td></tr>`).join("")}</table></div>`:""}
      <div class="btns" style="margin-top:12px"><button class="btn d sm" onclick="borrarCompra('${x.id}')">Borrar compra</button></div>
      </div></details>`).join("")
  :`<div class="empty"><b>Sin compras</b>Registra dónde, cómo y a qué tasa pagaste.</div>`}`;
};
function postCompras(){ pintarItems(); totCompra(); }
function totCompra(){ const m=n0($("#cMonto")?.value), t=n0($("#cTasa")?.value), el=$("#cConv"); if(!el) return;
  el.innerHTML = m>0&&t>0 ? `<b class="num">${usd(m/t)}</b> · <b class="num">${cop(m/t*DB.cfg.tasaCop)}</b>` : ""; }
function addItemReg(){
  const nom=$("#cAl").value; if(!nom) return;
  const al=DB.alimentos.find(a=>a.nombre===nom&&!a.compraId);
  itemsCompra.push({alimentoId:al?al.id:null,nombre:nom,kg:n0($("#cKg").value)||(al?al.cantidadKg:0),bs:al?n0(al.precioBs):0});
  $("#cKg").value=""; pintarItems();
}
function addItemLibre(){
  const nom=$("#cLibre").value.trim(); if(!nom) return toast("Escribe el nombre del artículo",true);
  itemsCompra.push({alimentoId:null,nombre:nom,kg:0,bs:n0($("#cLibreBs").value)});
  $("#cLibre").value=""; $("#cLibreBs").value=""; pintarItems();
}
function quitarItem(i){ itemsCompra.splice(i,1); pintarItems(); }
function pintarItems(){
  const el=$("#cItems"); if(!el) return;
  if(!itemsCompra.length){ el.innerHTML=`<p class="muted">Ningún artículo agregado.</p>`; return; }
  const sum=itemsCompra.reduce((s,i)=>s+n0(i.bs),0);
  el.innerHTML=`<div class="chips" style="margin:10px 0">${itemsCompra.map((i,k)=>`<span class="chip">${esc(i.nombre)}${i.kg?` · ${nf(i.kg,3)} kg`:""}${i.bs?` · ${nf(i.bs,2)} Bs`:""}<button onclick="quitarItem(${k})" aria-label="Quitar">×</button></span>`).join("")}</div>
    <button class="btn o sm" onclick="$('#cMonto').value=${sum.toFixed(2)};totCompra()">Usar ${bs(sum)} como total</button>`;
}
function guardarCompra(){
  const monto=n0($("#cMonto").value); if(monto<=0) return toast("Falta el monto total en Bs",true);
  const lid=$("#cLugar").value||null;
  const c={id:uid(),fecha:$("#cFecha").value||hoy(),lugarId:lid,lugar:nomLugar(lid),metodo:$("#cMetodo").value,
    montoBs:monto,tasa:n0($("#cTasa").value),nota:$("#cNota").value.trim(),items:clon(itemsCompra)};
  DB.compras.push(c);
  c.items.forEach(i=>{
    if(i.alimentoId){ const a=getAl(i.alimentoId); if(a){ a.compraId=c.id; if(!a.lugarId) a.lugarId=lid; } }
    else if(i.kg>0&&i.bs>0) registrarPrecio({nombre:i.nombre,precioBs:i.bs,kg:i.kg,tasa:c.tasa,fecha:c.fecha,lugarId:lid});
  });
  itemsCompra=[]; guardar(); render(); toast("Compra guardada");
}
function borrarCompra(id){
  if(!confirm("¿Borrar esta compra? Los alimentos quedan en la despensa.")) return;
  DB.alimentos.forEach(a=>{ if(a.compraId===id) a.compraId=null; });
  DB.compras=DB.compras.filter(x=>x.id!==id); guardar(); render(); toast("Compra borrada");
}

/* ═════════ 9. Lista de compras ═════════ */
function aLista(nom){
  if(DB.listaCompra.some(x=>norm(x.nombre)===norm(nom)&&!x.hecho)) return toast("Ya está en la lista",true);
  DB.listaCompra.push({id:uid(),nombre:nom,nota:"",hecho:false,auto:false});
  guardar(); toast(nom+" va a la lista de compras");
}
function sugerencias(){
  const c=DB.cfg, h=hoy(), s=[], vistos=new Set();
  DB.alimentos.forEach(a=>{
    const k=norm(a.nombre);
    if(vistos.has(k)) return;
    const vencido=a.fVence&&dias(h,a.fVence)<0;
    const bajo=a.gramosDisp<=c.avisoGramos;
    if(!bajo&&!vencido) return;
    if(DB.listaCompra.some(x=>norm(x.nombre)===k&&!x.hecho)) return;
    vistos.add(k);
    s.push({nombre:a.nombre, razon: a.gramosDisp<=0?"Agotado":vencido?"Vencido":`Quedan ${nf(a.gramosDisp,0)} g`, up:ultimoPrecio(a.nombre)});
  });
  return s;
}
V.listaCompra = function(){
  const sug=sugerencias();
  const pend=DB.listaCompra.filter(x=>!x.hecho), hechos=DB.listaCompra.filter(x=>x.hecho);
  let estBs=0;
  pend.forEach(x=>{ const up=ultimoPrecio(x.nombre); if(up) estBs+=up.bsKg; });
  return `<h2 class="vt">Lista de compras</h2>
  ${sug.length?`<div class="eyebrow">Sugerido · lo que se agotó o venció</div>
    ${sug.map(s=>`<div class="chk">
      <div class="cn">${esc(s.nombre)}<small>${s.razon}${s.up?` · última vez ${nf(s.up.bsKg,2)} Bs/kg en ${esc(nomLugar(s.up.lugarId))}`:""}</small></div>
      <button class="btn g sm" onclick="aLista('${esc(s.nombre).replace(/'/g,"\\'")}');render()">Agregar</button></div>`).join("")}
    <button class="btn o sm" style="margin-bottom:6px" onclick="agregarTodos()">Agregar los ${sug.length} sugeridos</button>`:""}

  <div class="eyebrow">Agregar a mano</div>
  <div class="card"><div class="grid g3" style="align-items:end">
    <div class="f"><label>Artículo</label><input id="lcN" placeholder="Ej: Huevos" onkeydown="if(event.key==='Enter')addLC()"></div>
    <div class="f"><label>Nota</label><input id="lcNota" placeholder="2 cartones" onkeydown="if(event.key==='Enter')addLC()"></div>
    <div class="f"><button class="btn g sm full" onclick="addLC()">Agregar</button></div></div></div>

  <div class="eyebrow">Por comprar · ${pend.length}</div>
  ${pend.length?pend.map(x=>{ const up=ultimoPrecio(x.nombre); return `<div class="chk">
      <input type="checkbox" onchange="marcarLC('${x.id}')" aria-label="Marcar comprado">
      <div class="cn">${esc(x.nombre)}<small>${x.nota?esc(x.nota)+" · ":""}${up?`≈ ${nf(up.bsKg,2)} Bs/kg · ${esc(nomLugar(up.lugarId))}`:"sin precio previo"}</small></div>
      <button class="btn d sm" onclick="borrarLC('${x.id}')">Quitar</button></div>`}).join("")
    +(estBs>0?`<p class="muted">Estimado aproximado por kg de cada artículo: <b class="num">${bs(estBs)}</b> · ${usd(aUsd(estBs))}</p>`:"")
   :`<div class="empty"><b>Lista vacía</b>Cuando algo se agote o venza, aparece aquí solo.</div>`}

  ${hechos.length?`<div class="eyebrow">Ya comprado · ${hechos.length}</div>
    ${hechos.map(x=>`<div class="chk on"><input type="checkbox" checked onchange="marcarLC('${x.id}')" aria-label="Desmarcar">
      <div class="cn">${esc(x.nombre)}</div><button class="btn d sm" onclick="borrarLC('${x.id}')">Quitar</button></div>`).join("")}
    <button class="btn o sm" onclick="limpiarLC()">Vaciar los comprados</button>`:""}`;
};
function addLC(){
  const n=$("#lcN").value.trim(); if(!n) return toast("Escribe el artículo",true);
  DB.listaCompra.push({id:uid(),nombre:n,nota:$("#lcNota").value.trim(),hecho:false,auto:false});
  guardar(); render(); toast("Agregado a la lista");
}
function agregarTodos(){ sugerencias().forEach(s=>DB.listaCompra.push({id:uid(),nombre:s.nombre,nota:s.razon,hecho:false,auto:true}));
  guardar(); render(); toast("Sugeridos agregados"); }
function marcarLC(id){ const x=DB.listaCompra.find(y=>y.id===id); if(x){ x.hecho=!x.hecho; guardar(); render(); } }
function borrarLC(id){ DB.listaCompra=DB.listaCompra.filter(x=>x.id!==id); guardar(); render(); }
function limpiarLC(){ DB.listaCompra=DB.listaCompra.filter(x=>!x.hecho); guardar(); render(); toast("Lista limpia"); }

/* ═════════ 10. Precios ═════════ */
let precioSel="";
function verPrecios(nom){ precioSel=nom; ir("precios"); }
V.precios = function(){
  const claves=[...new Set(DB.precios.map(p=>p.clave))];
  const nombres=claves.map(k=>DB.precios.find(p=>p.clave===k).nombre).sort((a,b)=>a.localeCompare(b));
  if(!precioSel&&nombres.length) precioSel=nombres[0];
  const H=preciosDe(precioSel);
  const conUsd=H.filter(p=>p.usdKg>0);
  const mejor=conUsd.length?conUsd.reduce((a,b)=>b.usdKg<a.usdKg?b:a):null;
  const prim=conUsd[0], ult=conUsd[conUsd.length-1];
  const varPct=prim&&ult&&prim.usdKg>0&&conUsd.length>1?(ult.usdKg-prim.usdKg)/prim.usdKg*100:null;

  // Mejor lugar por alimento (resumen)
  const resumen=claves.map(k=>{
    const ps=DB.precios.filter(p=>p.clave===k&&p.usdKg>0);
    if(!ps.length) return null;
    const b=ps.reduce((a,c)=>c.usdKg<a.usdKg?c:a);
    const o=ps.slice().sort((a,b2)=>a.fecha.localeCompare(b2.fecha));
    const v=o.length>1&&o[0].usdKg>0?(o[o.length-1].usdKg-o[0].usdKg)/o[0].usdKg*100:null;
    return {nombre:ps[0].nombre, mejorLugar:nomLugar(b.lugarId), mejorUsd:b.usdKg, actual:o[o.length-1].usdKg, v};
  }).filter(Boolean).sort((a,b)=>a.nombre.localeCompare(b.nombre));

  const conV=resumen.filter(r=>r.v!==null);
  const canasta=conV.length?conV.reduce((s,r)=>s+r.v,0)/conV.length:null;

  return `<h2 class="vt">Precios</h2>
  ${!DB.precios.length?`<div class="empty"><b>Sin historial todavía</b>Cada alimento que registres con precio y kg va guardando su precio por kilo aquí.</div>`:`
  ${canasta!==null?`<div class="kpi ${canasta>0?"rd":"gr"}" style="margin-bottom:13px">
    <div class="lbl">Variación promedio de tu canasta (en dólares)</div>
    <div class="big ${canasta>0?"rd":"gr"}">${canasta>=0?"+":""}${nf(canasta,1)}%</div>
    <div class="sub">entre el primer y el último precio de ${conV.length} alimento(s)</div></div>`:""}

  <div class="card">
    <div class="f" style="margin:0"><label>Ver un alimento</label>
      <select onchange="precioSel=this.value;render()">${opts(nombres,precioSel)}</select></div>
  </div>

  ${H.length?`
  <div class="eyebrow">Dónde sale más barato</div>
  <div class="card scroll"><table><tr><th>Fecha</th><th>Lugar</th><th>Bs/kg</th><th>Tasa</th><th>$/kg</th></tr>
    ${H.slice().sort((a,b)=>a.usdKg-b.usdKg).map(p=>`<tr class="${mejor&&p.id===mejor.id?"best":""}">
      <td>${fecha(p.fecha)}</td><td>${esc(nomLugar(p.lugarId))}</td><td class="n">${nf(p.bsKg,2)}</td>
      <td class="n">${p.tasa>0?nf(p.tasa,2):"—"}</td><td class="n">${p.usdKg>0?usd(p.usdKg):"—"}</td></tr>`).join("")}</table>
    ${mejor?`<p class="muted" style="margin-top:9px">Más barato en <b>${esc(nomLugar(mejor.lugarId))}</b> a ${usd(mejor.usdKg)} el kilo (${fecha(mejor.fecha)}).</p>`:""}</div>

  ${conUsd.length>1?`<div class="eyebrow">Cómo ha cambiado · ${esc(precioSel)}</div>
  <div class="card">
    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <div><span class="lbl">Primer precio</span><div class="num" style="font-size:17px;font-weight:700">${usd(prim.usdKg)}</div><div class="muted">${fecha(prim.fecha)}</div></div>
      <div><span class="lbl">Último precio</span><div class="num" style="font-size:17px;font-weight:700">${usd(ult.usdKg)}</div><div class="muted">${fecha(ult.fecha)}</div></div>
      <div><span class="lbl">Variación</span><div class="num" style="font-size:17px;font-weight:700;color:${varPct>0?"var(--red)":"var(--green-l)"}">${varPct>=0?"+":""}${nf(varPct,1)}%</div><div class="muted">en dólares por kg</div></div>
    </div>
    ${spark(conUsd.map(p=>p.usdKg), varPct>0?"#FF4757":"#16C784")}
    <div class="muted" style="display:flex;justify-content:space-between"><span>${fecha(conUsd[0].fecha)}</span><span>${fecha(ult.fecha)}</span></div>
  </div>`:""}
  <div class="btns" style="margin-top:12px"><button class="btn o sm" onclick="borrarPrecios('${norm(precioSel)}')">Borrar historial de ${esc(precioSel)}</button></div>
  `:""}

  <div class="eyebrow">Resumen de todos</div>
  <div class="card scroll"><table><tr><th>Alimento</th><th>Mejor lugar</th><th>Mejor $/kg</th><th>Actual</th><th>Var.</th></tr>
    ${resumen.map(r=>`<tr><td>${esc(r.nombre)}</td><td>${esc(r.mejorLugar)}</td><td class="n">${usd(r.mejorUsd)}</td>
    <td class="n">${usd(r.actual)}</td><td class="n" style="color:${r.v>0?"var(--red)":r.v<0?"var(--green-l)":"var(--dim)"}">${r.v===null?"—":(r.v>=0?"+":"")+nf(r.v,1)+"%"}</td></tr>`).join("")}</table></div>`}`;
};
function postPrecios(){}
function borrarPrecios(clave){
  if(!confirm("Se borra todo el historial de precios de este alimento. ¿Continuar?")) return;
  DB.precios=DB.precios.filter(p=>p.clave!==clave); precioSel=""; guardar(); render(); toast("Historial borrado");
}

/* ═════════ 11. Recetas ═════════ */
let recetaItems=[], recetaEdit=null;
V.recetas = function(){
  const base=[...new Set([...DB.alimentos.map(a=>a.nombre), ...Object.values(DB.nutricion).map(m=>m.nombre)])].sort((a,b)=>a.localeCompare(b));
  return `<h2 class="vt">Recetas</h2>
  <p class="muted" style="margin:-6px 0 13px">Guarda los combos que repites. Al cargarlos en Dietas se arma el plato completo y se descuentan los gramos.</p>
  <div class="card">
    <div class="grid g2">
      <div class="f"><label>Nombre de la receta</label><input id="rN" placeholder="Ej: Almuerzo de volumen" value="${recetaEdit?esc(recetaEdit.nombre):""}"></div>
      <div class="f"><label>Comida sugerida</label><select id="rC">${opts(DB.cfg.comidas, recetaEdit?recetaEdit.comida:"")}</select></div></div>
    ${base.length?`<div class="grid g3" style="align-items:end">
      <div class="f"><label>Alimento</label><select id="rAl">${opts(base,"")}</select></div>
      <div class="f"><label>Gramos</label><input id="rG" inputmode="decimal" placeholder="150"></div>
      <div class="f"><button class="btn sm full" onclick="addRecetaItem()">Agregar</button></div></div>`
     :`<p class="muted">Registra alimentos o macros primero.</p>`}
    <div id="rItems"></div>
    <div class="btns" style="margin-top:12px"><button class="btn g" onclick="guardarReceta()">${recetaEdit?"Guardar cambios":"Guardar receta"}</button>
      ${recetaEdit?`<button class="btn o" onclick="recetaEdit=null;recetaItems=[];render()">Cancelar</button>`:""}</div>
  </div>
  <div class="eyebrow">Tus recetas · ${DB.recetas.length}</div>
  ${DB.recetas.length?DB.recetas.map(r=>{
    const t=r.items.reduce((s,i)=>{const m=macrosDe(i.nombre)||{cal:0,prot:0,carb:0,gras:0},f=i.gramos/100;
      return {cal:s.cal+m.cal*f,prot:s.prot+m.prot*f,carb:s.carb+m.carb*f,gras:s.gras+m.gras*f}},{cal:0,prot:0,carb:0,gras:0});
    return `<details class="item s-verde"><summary>
      <div class="it-main"><div class="it-name">${esc(r.nombre)}</div><div class="it-meta">${esc(r.comida)} · ${r.items.length} alimento(s)</div></div>
      <div class="it-right"><div class="it-price">${nf(t.cal,0)}<small>kcal</small></div></div></summary>
      <div class="detail">
        <div class="scroll"><table><tr><th>Alimento</th><th>g</th><th>kcal</th></tr>
          ${r.items.map(i=>{const m=macrosDe(i.nombre); return `<tr><td>${esc(i.nombre)}</td><td class="n">${nf(i.gramos,0)}</td><td class="n">${m?nf(m.cal*i.gramos/100,0):"—"}</td></tr>`}).join("")}</table></div>
        <div class="macro"><span>P <b>${nf(t.prot,1)} g</b></span><span>C <b>${nf(t.carb,1)} g</b></span><span>G <b>${nf(t.gras,1)} g</b></span></div>
        <div class="btns" style="margin-top:12px">
          <button class="btn g sm" onclick="usarReceta('${r.id}')">Usar en Dietas</button>
          <button class="btn sm" onclick="editarReceta('${r.id}')">Editar</button>
          <button class="btn d sm" onclick="borrarReceta('${r.id}')">Borrar</button></div>
      </div></details>`}).join("")
  :`<div class="empty"><b>Sin recetas</b>Guarda tu desayuno de siempre y cárgalo en un toque.</div>`}`;
};
function postRecetas(){ pintarRecetaItems(); }
function addRecetaItem(){
  const n=$("#rAl").value, g=n0($("#rG").value);
  if(!n) return; if(g<=0) return toast("Escribe los gramos",true);
  recetaItems.push({nombre:n,gramos:g}); $("#rG").value=""; pintarRecetaItems();
}
function quitarRecetaItem(i){ recetaItems.splice(i,1); pintarRecetaItems(); }
function pintarRecetaItems(){
  const el=$("#rItems"); if(!el) return;
  if(!recetaItems.length){ el.innerHTML=`<p class="muted">La receta está vacía.</p>`; return; }
  const t=recetaItems.reduce((s,i)=>{const m=macrosDe(i.nombre)||{cal:0,prot:0,carb:0,gras:0},f=i.gramos/100;
    return {cal:s.cal+m.cal*f,prot:s.prot+m.prot*f,carb:s.carb+m.carb*f,gras:s.gras+m.gras*f}},{cal:0,prot:0,carb:0,gras:0});
  el.innerHTML=`<div class="chips" style="margin:10px 0">${recetaItems.map((i,k)=>`<span class="chip">${esc(i.nombre)} · ${nf(i.gramos,0)} g<button onclick="quitarRecetaItem(${k})" aria-label="Quitar">×</button></span>`).join("")}</div>
    <div class="macro"><span>Total <b>${nf(t.cal,0)} kcal</b></span><span>P <b>${nf(t.prot,1)}</b></span><span>C <b>${nf(t.carb,1)}</b></span><span>G <b>${nf(t.gras,1)}</b></span></div>`;
}
function guardarReceta(){
  const n=$("#rN").value.trim(); if(!n) return toast("Ponle nombre a la receta",true);
  if(!recetaItems.length) return toast("Agrega al menos un alimento",true);
  if(recetaEdit){ Object.assign(recetaEdit,{nombre:n,comida:$("#rC").value,items:clon(recetaItems)}); recetaEdit=null; }
  else DB.recetas.push({id:uid(),nombre:n,comida:$("#rC").value,items:clon(recetaItems)});
  recetaItems=[]; guardar(); render(); toast("Receta guardada");
}
function editarReceta(id){ recetaEdit=DB.recetas.find(r=>r.id===id); recetaItems=clon(recetaEdit.items); render(); window.scrollTo({top:0}); }
function borrarReceta(id){ if(!confirm("¿Borrar esta receta?")) return; DB.recetas=DB.recetas.filter(r=>r.id!==id); guardar(); render(); toast("Receta borrada"); }
function usarReceta(id){ recetaPendiente=id; ir("dietas"); }

/* ═════════ 12. Dietas ═════════ */
let dietaFecha=hoy(), platoItems=[], recetaPendiente=null;
V.dietas = function(){
  const disp=DB.alimentos.filter(a=>a.gramosDisp>0).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const delDia=DB.dietas.filter(d=>d.fecha===dietaFecha);
  const tot={cal:0,prot:0,carb:0,gras:0};
  delDia.forEach(d=>d.items.forEach(i=>{tot.cal+=i.cal;tot.prot+=i.prot;tot.carb+=i.carb;tot.gras+=i.gras}));
  const P=DB.perfil;
  return `<h2 class="vt">Dietas del día</h2>
  <div class="card">
    <div class="grid g2">
      <div class="f"><label>Día</label><input type="date" value="${dietaFecha}" onchange="dietaFecha=this.value;render()"></div>
      <div class="f"><label>Comida</label><select id="dComida">${opts(DB.cfg.comidas,"")}</select></div></div>
    ${DB.recetas.length?`<div class="f"><label>Cargar una receta</label>
      <div style="display:flex;gap:8px"><select id="dRec">${DB.recetas.map(r=>`<option value="${r.id}">${esc(r.nombre)}</option>`).join("")}</select>
      <button class="btn sm" style="flex-shrink:0" onclick="cargarReceta($('#dRec').value)">Cargar</button></div></div>`:""}
    ${disp.length?`<div class="grid g3" style="align-items:end">
      <div class="f"><label>Alimento disponible</label><select id="dAl" onchange="pistaPlato()">${disp.map(a=>`<option value="${a.id}">${esc(a.nombre)} · ${nf(a.gramosDisp,0)} g</option>`).join("")}</select></div>
      <div class="f"><label>Gramos a usar</label><input id="dG" inputmode="decimal" placeholder="150" oninput="pistaPlato()"></div>
      <div class="f"><button class="btn sm full" onclick="addPlato()">Agregar al plato</button></div></div>
      <div id="dPista" class="muted"></div><div id="dItems"></div>
      <button class="btn g full" style="margin-top:12px" onclick="guardarPlato()">Registrar comida y descontar</button>`
     :`<p class="muted">No hay alimentos con gramos disponibles.</p>`}
  </div>
  ${P.metaCal>0?`<div class="eyebrow">Total del día contra tu meta</div><div class="card">
    ${["cal|Calorías|kcal","prot|Proteínas|g","carb|Carbohidratos|g","gras|Grasas|g"].map(x=>{
      const [k,l,u]=x.split("|"), meta={cal:P.metaCal,prot:P.metaProt,carb:P.metaCarb,gras:P.metaGrasa}[k], pct=meta>0?tot[k]/meta*100:0;
      return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${l}</span>
      <span class="num">${nf(tot[k],0)} / ${nf(meta,0)} ${u}</span></div>
      <div class="bar"><i class="${pct>=95&&pct<=110?"ok":pct>110?"warn":""}" style="width:${Math.min(100,pct)}%"></i></div></div>`}).join("")}
  </div>`:`<div class="warn">Define tus metas en <b>Salud y volumen</b> para ver el progreso diario.</div>`}
  <div class="eyebrow">Comidas de ${fecha(dietaFecha)}</div>
  ${delDia.length?delDia.map(d=>`<details class="item s-verde"><summary>
      <div class="it-main"><div class="it-name">${esc(d.comida)}</div><div class="it-meta">${d.items.map(i=>esc(i.nombre)+" "+nf(i.gramos,0)+" g").join(" · ")}</div></div>
      <div class="it-right"><div class="it-price">${nf(d.items.reduce((s,i)=>s+i.cal,0),0)}<small>kcal</small></div></div></summary>
      <div class="detail"><div class="scroll"><table><tr><th>Alimento</th><th>g</th><th>kcal</th><th>P</th><th>C</th><th>G</th></tr>
        ${d.items.map(i=>`<tr><td>${esc(i.nombre)}</td><td class="n">${nf(i.gramos,0)}</td><td class="n">${nf(i.cal,0)}</td><td class="n">${nf(i.prot,1)}</td><td class="n">${nf(i.carb,1)}</td><td class="n">${nf(i.gras,1)}</td></tr>`).join("")}</table></div>
      <div class="btns" style="margin-top:11px"><button class="btn d sm" onclick="borrarPlato('${d.id}')">Borrar y devolver gramos</button></div>
      </div></details>`).join("")
  :`<div class="empty"><b>Día en blanco</b>Arma tu primera comida con lo que tienes.</div>`}`;
};
function postDietas(){
  if(recetaPendiente){ const id=recetaPendiente; recetaPendiente=null; cargarReceta(id); }
  pintarPlato(); pistaPlato();
}
function pistaPlato(){
  const el=$("#dPista"); if(!el) return;
  const a=getAl($("#dAl")?.value), g=n0($("#dG")?.value);
  if(!a){ el.textContent=""; return; }
  const m=macrosDe(a.nombre);
  if(!m){ el.innerHTML=`<span class="badge b-org">Sin macros</span> Agrégalos en Nutrición.`; return; }
  if(g<=0){ el.innerHTML=`Por 100 g: ${nf(m.cal,0)} kcal · P ${nf(m.prot,1)} · C ${nf(m.carb,1)} · G ${nf(m.gras,1)}`; return; }
  const f=g/100;
  el.innerHTML=`<b class="num">${nf(m.cal*f,0)} kcal</b> · P ${nf(m.prot*f,1)} g · C ${nf(m.carb*f,1)} g · G ${nf(m.gras*f,1)} g${g>a.gramosDisp?` <span class="badge b-red">solo hay ${nf(a.gramosDisp,0)} g</span>`:""}`;
}
function addPlato(){
  const a=getAl($("#dAl").value); if(!a) return;
  const g=n0($("#dG").value); if(g<=0) return toast("Escribe cuántos gramos usas",true);
  const ya=platoItems.filter(i=>i.alimentoId===a.id).reduce((s,i)=>s+i.gramos,0);
  if(g+ya>a.gramosDisp) return toast(`Solo quedan ${nf(a.gramosDisp-ya,0)} g de ${a.nombre}`,true);
  const m=macrosDe(a.nombre)||{cal:0,prot:0,carb:0,gras:0}, f=g/100;
  platoItems.push({alimentoId:a.id,nombre:a.nombre,gramos:g,cal:m.cal*f,prot:m.prot*f,carb:m.carb*f,gras:m.gras*f});
  $("#dG").value=""; pintarPlato(); pistaPlato();
}
function quitarPlato(i){ platoItems.splice(i,1); pintarPlato(); }
function pintarPlato(){
  const el=$("#dItems"); if(!el) return;
  if(!platoItems.length){ el.innerHTML=`<p class="muted">El plato está vacío.</p>`; return; }
  const t=platoItems.reduce((s,i)=>({cal:s.cal+i.cal,prot:s.prot+i.prot,carb:s.carb+i.carb,gras:s.gras+i.gras}),{cal:0,prot:0,carb:0,gras:0});
  el.innerHTML=`<div class="chips" style="margin:10px 0">${platoItems.map((i,k)=>`<span class="chip">${esc(i.nombre)} · ${nf(i.gramos,0)} g<button onclick="quitarPlato(${k})" aria-label="Quitar">×</button></span>`).join("")}</div>
    <div class="macro"><span>Total <b>${nf(t.cal,0)} kcal</b></span><span>P <b>${nf(t.prot,1)} g</b></span><span>C <b>${nf(t.carb,1)} g</b></span><span>G <b>${nf(t.gras,1)} g</b></span></div>`;
}
function cargarReceta(id){
  const r=DB.recetas.find(x=>x.id===id); if(!r) return;
  const faltan=[];
  r.items.forEach(it=>{
    const cand=DB.alimentos.filter(x=>norm(x.nombre)===norm(it.nombre)&&x.gramosDisp>0)
      .sort((x,y)=>(x.fVence||"9999").localeCompare(y.fVence||"9999"))[0];
    if(!cand){ faltan.push(it.nombre); return; }
    const ya=platoItems.filter(i=>i.alimentoId===cand.id).reduce((s,i)=>s+i.gramos,0);
    const g=Math.min(it.gramos, cand.gramosDisp-ya);
    if(g<=0){ faltan.push(it.nombre); return; }
    if(g<it.gramos) faltan.push(`${it.nombre} (solo ${nf(g,0)} g)`);
    const m=macrosDe(it.nombre)||{cal:0,prot:0,carb:0,gras:0}, f=g/100;
    platoItems.push({alimentoId:cand.id,nombre:cand.nombre,gramos:g,cal:m.cal*f,prot:m.prot*f,carb:m.carb*f,gras:m.gras*f});
  });
  const sel=$("#dComida"); if(sel&&r.comida) sel.value=r.comida;
  pintarPlato();
  toast(faltan.length?`Cargada. Falta o alcanza justo: ${faltan.join(", ")}`:`Receta "${r.nombre}" cargada`, faltan.length>0);
}
function guardarPlato(){
  if(!platoItems.length) return toast("Agrega al menos un alimento",true);
  const d={id:uid(),fecha:dietaFecha,comida:$("#dComida").value,items:clon(platoItems),creado:Date.now()};
  d.items.forEach(i=>{ const a=getAl(i.alimentoId); if(a) a.gramosDisp=Math.max(0,a.gramosDisp-i.gramos); });
  DB.dietas.push(d); platoItems=[]; guardar(); render(); toast("Comida registrada · gramos descontados");
}
function borrarPlato(id){
  const d=DB.dietas.find(x=>x.id===id); if(!d) return;
  if(!confirm("Se borra la comida y los gramos vuelven a la despensa. ¿Continuar?")) return;
  d.items.forEach(i=>{ const a=getAl(i.alimentoId); if(a) a.gramosDisp+=i.gramos; });
  DB.dietas=DB.dietas.filter(x=>x.id!==id); guardar(); render(); toast("Comida borrada · gramos devueltos");
}

function calcMetas(p){
  const tmb = p.sexo==="H" ? 10*p.peso+6.25*p.altura-5*p.edad+5 : 10*p.peso+6.25*p.altura-5*p.edad-161;
  const gasto=tmb*p.actividad, cal=gasto+n0(p.superavit), prot=p.peso*n0(p.gProt), gras=p.peso*n0(p.gGrasa);
  return {tmb,gasto,cal,prot,gras,carb:Math.max(0,(cal-prot*4-gras*9)/4)};
}

};

function exportar(){
  const b=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download="blychfood-"+hoy()+".json"; a.click(); URL.revokeObjectURL(u); toast("Respaldo exportado");

function importar(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result); if(!d.alimentos) throw 0;
      if(!confirm("Se reemplazan todos los datos actuales por los del respaldo. ¿Continuar?")) return;
      localStorage.setItem(KEY,JSON.stringify(d)); DB=cargar(); render(); toast("Respaldo importado");
    }catch(e){ toast("El archivo no es un respaldo válido",true); } };
  r.readAsText(f); inp.value="";
}

  localStorage.removeItem(KEY); localStorage.removeItem(VIEJA); DB=clon(DEF); render(); toast("Datos borrados");
}
